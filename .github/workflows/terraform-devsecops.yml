name: GCP Terraform DevSecOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  terraform-devsecops:
    name: Terraform DevSecOps
    runs-on: [self-hosted]

    env:
      GOOGLE_PROJECT: project-1e2da3fc-bb97-4b70-9c0
      GOOGLE_REGION: us-east1
      TF_IN_AUTOMATION: true
      ENVIRONMENT: dev

    steps:
    # ----------------------------
    # Checkout
    # ----------------------------
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ----------------------------
    # Terraform Setup
    # ----------------------------
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.12.2

    # ----------------------------
    # GCP Auth
    # ----------------------------
    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    # ----------------------------
    # Terraform Init
    # ----------------------------
    - name: Terraform Init
      run: terraform init

    # ----------------------------
    # Terraform Quality & Security
    # ----------------------------
    - name: Terraform Format
      run: terraform fmt -recursive

    - name: Terraform Validate
      run: terraform validate

    - name: Run TFLint
      run: tflint

    - name: Run tfsec
      run: tfsec .

    - name: Run pre-commit
      run: pre-commit run --all-files

    # ----------------------------
    # Terraform Plan
    # ----------------------------
    - name: Terraform Plan
      run: terraform plan

    - name: Slack Notify Plan Success
      if: success()
      run: |
        curl -X POST -H 'Content-type: application/json' \
        --data '{
          "attachments":[{
            "color":"good",
            "title":"Terraform Plan Successful ✅",
            "fields":[
              {"title":"Environment","value":"'"$ENVIRONMENT"'","short":true},
              {"title":"Actor","value":"'"${{ github.actor }}"'","short":true}
            ]
          }]
        }' ${{ secrets.SLACK_WEBHOOK_URL }}

    # ----------------------------
    # Terraform Apply
    # ----------------------------
    - name: Terraform Apply
      if: github.ref == 'refs/heads/feat/github-actions-cicd'
      id: tf_apply
      continue-on-error: true
      run: |
        terraform apply -auto-approve
        echo "APPLY_EXIT_CODE=$?" >> $GITHUB_ENV

    # ----------------------------
    # Slack Apply Result
    # ----------------------------
    - name: Slack Notify Apply Result
      if: always() && github.ref == 'refs/heads/feat/github-actions-cicd'
      run: |
        if [ "$APPLY_EXIT_CODE" -eq 0 ]; then
          COLOR="good"
          TITLE="Terraform Apply Succeeded 🎉"
        else
          COLOR="danger"
          TITLE="Terraform Apply Failed 🚨"
        fi

        curl -X POST -H 'Content-type: application/json' \
        --data '{
          "attachments":[{
            "color":"'"$COLOR"'",
            "title":"'"$TITLE"'",
            "fields":[
              {"title":"Environment","value":"'"$ENVIRONMENT"'","short":true},
              {"title":"Actor","value":"'"${{ github.actor }}"'","short":true},
              {"title":"Logs","value":"'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'","short":false}
            ]
          }]
        }' ${{ secrets.SLACK_WEBHOOK_URL }}

    # ----------------------------
    # Jira Incident on Apply Failure
    # ----------------------------
    - name: Create Jira Incident
      if: env.APPLY_EXIT_CODE != '0' && github.ref == 'refs/heads/feat/github-actions-cicd'
      run: |
        curl -X POST \
          -H "Content-Type: application/json" \
          -u "${{ secrets.JIRA_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
          --data '{
            "fields": {
              "project": { "key": "'"${{ secrets.JIRA_PROJECT_KEY }}"'" },
              "summary": "Terraform Apply Failed - '"$ENVIRONMENT"'",
              "issuetype": { "name": "Incident" },
              "priority": { "name": "High" },
              "description": {
                "type": "doc",
                "version": 1,
                "content":[{
                  "type":"paragraph",
                  "content":[{
                    "type":"text",
                    "text":"Terraform apply failed. Logs: '"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'"
                  }]
                }]
              }
            }
          }' \
          "${{ secrets.JIRA_BASE_URL }}/rest/api/3/issue"

    # ----------------------------
    # Rollback Notification
    # ----------------------------
    - name: Slack Notify Rollback Required
      if: env.APPLY_EXIT_CODE != '0' && github.ref == 'refs/heads/feat/github-actions-cicd'
      run: |
        curl -X POST -H 'Content-type: application/json' \
        --data '{
          "attachments":[{
            "color":"danger",
            "title":"🚨 Rollback Required",
            "fields":[
              {"title":"Environment","value":"'"$ENVIRONMENT"'","short":true},
              {"title":"Action","value":"Terraform apply failed — rollback required","short":false}
            ]
          }]
        }' ${{ secrets.SLACK_WEBHOOK_URL }}
