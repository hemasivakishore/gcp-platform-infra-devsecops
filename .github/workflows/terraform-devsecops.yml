name: GCP Terraform DevSecOps Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  terraform-devsecops:
    name: Terraform DevSecOps
    runs-on: [self-hosted]

    env:
      GOOGLE_PROJECT: project-1e2da3fc-bb97-4b70-9c0
      GOOGLE_REGION: us-east1
      TF_IN_AUTOMATION: true
      ENVIRONMENT: dev

    steps:
    # ----------------------------
    # Checkout
    # ----------------------------
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ----------------------------
    # Setup Terraform
    # ----------------------------
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.12.2

    # ----------------------------
    # GCP Credentials (ADC - REQUIRED for self-hosted macOS)
    # ----------------------------
    - name: Authenticate to GCP
      run: |
        echo '${{ secrets.GCP_SA_KEY }}' > $HOME/gcp-sa.json
        echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcp-sa.json" >> $GITHUB_ENV

    # ----------------------------
    # Terraform Init
    # ----------------------------
    - name: Terraform Init
      run: |
        rm -rf .terraform
        terraform init -upgrade

    # ----------------------------
    # Quality & Security
    # ----------------------------
    - name: Terraform Format
      run: terraform fmt -recursive

    - name: Terraform Validate
      run: terraform validate

    - name: Run TFLint
      run: tflint

    - name: Run tfsec
      run: tfsec .

    - name: Run pre-commit
      run: pre-commit run --all-files

    # ----------------------------
    # Terraform Plan (PR + Push)
    # ----------------------------
    - name: Terraform Plan
      run: terraform plan

    - name: Slack Notify Plan Success
      if: success()
      run: |
        curl -X POST -H 'Content-type: application/json' \
        --data '{
          "attachments":[{
            "color":"good",
            "title":"Terraform Plan Successful ✅",
            "fields":[
              {"title":"Environment","value":"'"$ENVIRONMENT"'","short":true},
              {"title":"Branch","value":"'"${{ github.ref_name }}"'","short":true},
              {"title":"Event","value":"'"${{ github.event_name }}"'","short":true}
            ]
          }]
        }' ${{ secrets.SLACK_WEBHOOK_URL }}

    # ----------------------------
    # Terraform Apply (ONLY after merge to main)
    # ----------------------------
    - name: Terraform Apply
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      continue-on-error: true
      run: |
        terraform apply -auto-approve
        echo "APPLY_EXIT_CODE=$?" >> $GITHUB_ENV

    # ----------------------------
    # Slack Apply Result
    # ----------------------------
    - name: Slack Notify Apply Result
      if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        if [ "$APPLY_EXIT_CODE" -eq 0 ]; then
          COLOR="good"
          TITLE="Terraform Apply Succeeded 🎉"
        else
          COLOR="danger"
          TITLE="Terraform Apply Failed 🚨"
        fi

        curl -X POST -H 'Content-type: application/json' \
        --data '{
          "attachments":[{
            "color":"'"$COLOR"'",
            "title":"'"$TITLE"'",
            "fields":[
              {"title":"Environment","value":"'"$ENVIRONMENT"'","short":true},
              {"title":"Actor","value":"'"${{ github.actor }}"'","short":true},
              {"title":"Logs","value":"'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'","short":false}
            ]
          }]
        }' ${{ secrets.SLACK_WEBHOOK_URL }}

    # ----------------------------
    # Jira Incident (Apply Failure ONLY)
    # ----------------------------
    - name: Create Jira Incident
      if: failure() && github.event_name == 'push'
      run: |
        if [ "$APPLY_RAN" = "true" ]; then
          SUMMARY="Terraform Apply Failed - $ENVIRONMENT"
          DESCRIPTION="Terraform apply failed. Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        else
          SUMMARY="Terraform Pipeline Failed Before Apply - $ENVIRONMENT"
          DESCRIPTION="Pipeline failed before terraform apply. Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        fi
    
        curl -X POST \
          -H "Content-Type: application/json" \
          -u "${{ secrets.JIRA_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
          --data '{
            "fields": {
              "project": { "key": "'"${{ secrets.JIRA_PROJECT_KEY }}"'" },
              "summary": "'"$SUMMARY"'",
              "issuetype": { "name": "Incident" },
              "priority": { "name": "High" },
              "description": {
                "type": "doc",
                "version": 1,
                "content":[{
                  "type":"paragraph",
                  "content":[{
                    "type":"text",
                    "text":"'"$DESCRIPTION"'"
                  }]
                }]
              }
            }
          }' \
          "${{ secrets.JIRA_BASE_URL }}/rest/api/3/issue"


    # ----------------------------
    # Rollback Notification
    # ----------------------------
    - name: Slack Notify Rollback Required
      if: env.APPLY_EXIT_CODE != '0' && github.event_name == 'push'
      run: |
        curl -X POST -H 'Content-type: application/json' \
        --data '{
          "attachments":[{
            "color":"danger",
            "title":"🚨 Rollback Required",
            "fields":[
              {"title":"Environment","value":"'"$ENVIRONMENT"'","short":true},
              {"title":"Action","value":"Terraform apply failed — rollback required","short":false}
            ]
          }]
        }' ${{ secrets.SLACK_WEBHOOK_URL }}
