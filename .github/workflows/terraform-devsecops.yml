name: GCP Terraform DevSecOps Pipeline

on:
  push:
    branches:
      - feat/github-actions-cicd
  pull_request:
    branches:
      - main

jobs:
  terraform-devsecops:
    name: Terraform DevSecOps
    runs-on: [self-hosted]

    env:
      GOOGLE_PROJECT: project-1e2da3fc-bb97-4b70-9c0
      GOOGLE_REGION: us-east1
      TF_IN_AUTOMATION: true

    steps:
    # ----------------------------
    # Checkout Source
    # ----------------------------
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ----------------------------
    # Setup Terraform
    # ----------------------------
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.12.2

    # ----------------------------
    # Debugging
    # ----------------------------
    - name: Debugging
      run: |
        whoami
        pwd

    # ----------------------------
    # Setup Google Credentials
    # ----------------------------
    - name: Configure GCP Credentials
      run: |
        echo "${{ secrets.GCP_SA_KEY }}" > sa.json
        echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/sa.json" >> $GITHUB_ENV

    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'


    # ----------------------------
    # Terraform Init
    # ----------------------------
    - name: Terraform Init
      run: terraform init

    # ----------------------------
    # Terraform Format
    # ----------------------------
    - name: Terraform Format
      run: terraform fmt -recursive

    # ----------------------------
    # Terraform Validate
    # ----------------------------
    - name: Terraform Validate
      run: terraform validate

    # ----------------------------
    # Run TFLint
    # ----------------------------
    - name: Run TFLint
      run: tflint

    # ----------------------------
    # Run tfsec
    # ----------------------------
    - name: Run tfsec
      run: tfsec .

    # ----------------------------
    # Install Pre-Commit
    # ----------------------------
    - name: Run pre-commit
      run: pre-commit run --all-files

    # ----------------------------
    # Terraform Plan
    # ----------------------------
    - name: Terraform Plan
      run: terraform plan

    # ----------------------------
    # Terraform Apply
    # ----------------------------
    - name: Terraform Apply
      if: github.ref == 'refs/heads/feat/github-actions-cicd'
      run: terraform apply -auto-approve
